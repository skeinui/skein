# Every push to main and every pull request: the tests on Linux, macOS and Windows (paths, line endings, the
# skeinThemes() Vite plugin), and on Linux the rest of `pnpm ready` (format, lint, types, build). Nothing more:
# the axe scan and the CLI's end-to-end run are the release's (release.yml), which also tests again before it
# publishes, so a release commit (the merged "Skein UI x.y.z" pull request) is skipped here.
name: CI
# The commit message / pull request title (the default) names a run after what it changed; the one thing it must not
# do is repeat a version: "Skein UI 0.1.2" is the release's run (release.yml), the release commit's run here says why
# it does nothing
run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Skein UI ')
    && 'CI (skipped: the release tests it)' || '' }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Skein UI ')
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check and build
        if: runner.os == 'Linux'
        run: pnpm exec vp check && pnpm exec vp run -r build
      - run: pnpm exec vp run -r test
