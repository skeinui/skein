# Releases, with changesets (no version pull request: the versions are bumped on your machine):
#
# - `pnpm release:prepare` runs `pnpm version-packages` (versions, CHANGELOGs, the manifest) and commits the result as
#   "Skein UI <version>". Pushing that commit to main is the release.
# - A push that leaves versions npm doesn't have yet: the publish job waits for the tests on Linux, macOS and
#   Windows (and check and build), the axe scan and the CLI's end-to-end run (a push to main runs only the tests,
#   ci.yml), then for an approval in the `npm` environment, publishes with `changeset publish`, tags the version
#   (`v0.0.6`: one tag for the five packages) and creates its GitHub Release.
#
# Publishing uses npm's trusted publishing: no token, GitHub's OIDC identity of this workflow, and npm adds
# provenance. Each package is set up on npmjs.com (Settings → Trusted publishing: skeinui/skein, release.yml,
# environment npm).
name: Release
# Not the commit message (CI shows it for the same commit), so the two runs of a push read apart in the Actions list;
# a release commit titled "Skein UI 0.0.6" (what `pnpm release:prepare` writes) gives "Release Skein UI 0.0.6"
run-name: >-
  ${{ startsWith(github.event.head_commit.message, 'Skein UI ')
    && format('Release {0}', github.event.head_commit.message)
    || format('Release ({0})', github.ref_name) }}

# Only a push that touches a package's version: a plain code push, or one that adds a changeset, runs the tests
# (ci.yml) and nothing else.
on:
  push:
    branches: [main]
    paths:
      - "packages/*/package.json"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'skeinui/skein'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.npm.outputs.unpublished }}
      version: ${{ steps.npm.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: versions npm doesn't have yet
        id: npm
        run: |
          unpublished=""
          for file in packages/*/package.json; do
            read -r name version private < <(node -p "const p = require('./$file'); [p.name, p.version, Boolean(p.private)].join(' ')")
            [ "$private" = "true" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")
            if [ "$code" = "404" ]; then unpublished="$unpublished $name@$version"; fi
          done
          unpublished="${unpublished# }"
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"
          # The packages are one fixed group: one version
          echo "version=$(node -p "require('./packages/ui/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "Not on npm yet: ${unpublished:-none}"

  # Before anything is published, the whole gate (ci.yml only runs `test` on a push): the tests on the three
  # platforms (a Windows-only bug fails here), check and build on Linux, the axe scan and the CLI's end-to-end run.
  # The approval is asked for once they all pass.
  test:
    needs: version
    if: needs.version.outputs.unpublished != ''
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check and build
        if: runner.os == 'Linux'
        run: pnpm exec vp check && pnpm exec vp run -r build
      - run: pnpm exec vp run -r test

  # The axe-core scan (packages/ui/tests/a11y): every theme style x light / dark x layout of the docs site's
  # AdminLayout demo, in the runner's Chrome, against the docs site's dev server
  a11y:
    needs: version
    if: needs.version.outputs.unpublished != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start the docs site
        run: |
          pnpm exec vp run skein-doc#dev > "$RUNNER_TEMP/docs.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:5175 > /dev/null; do sleep 2; done' || { cat "$RUNNER_TEMP/docs.log"; exit 1; }
      - run: pnpm exec vp run --fail-if-no-match --filter @skeinui/ui a11y

  # tests/e2e of the CLI: every preset generated with --local, npm / pnpm installed, checked and built, the admin
  # app driven in the runner's Chrome
  e2e:
    needs: version
    if: needs.version.outputs.unpublished != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run --fail-if-no-match --filter @skeinui/cli e2e

  publish:
    name: publish v${{ needs.version.outputs.version }}
    needs: [version, test, a11y, e2e]
    if: needs.version.outputs.unpublished != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The release's tag is annotated (`git tag -a`), which needs an identity: the runner has none
      - name: git identity for the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: publish ${{ needs.version.outputs.unpublished }}
        run: pnpm release
      # One tag and one GitHub Release per version (the packages are one fixed group), notes from the CHANGELOGs.
      # Both are skipped when they exist already, so a re-run after a failure finishes the job.
      - name: tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is on GitHub already"
          else
            git tag -a "v$version" -m "Skein UI $version"
            git push origin "v$version"
          fi
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || { echo "::error::tag v$version is missing"; exit 1; }
          if ! gh release view "v$version" > /dev/null 2>&1; then
            node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "v$version" --verify-tag --title "Skein UI $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
