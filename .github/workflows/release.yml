# Releases, with changesets:
#
# - A push to main with changesets in .changeset/ opens (or updates) the "Version packages" pull request: the
#   versions bumped, the CHANGELOGs written, the manifest refreshed (`pnpm version-packages`).
# - Merging it (or pushing versions bumped locally) leaves versions that npm doesn't have yet: the publish job waits
#   for the tests on Linux, macOS and Windows (and check and build), then for an approval in the `npm` environment,
#   publishes with `changeset publish`, tags the version (`v0.0.6`: one tag for the five packages) and creates its
#   GitHub Release.
#
# Publishing uses npm's trusted publishing: no token, GitHub's OIDC identity of this workflow, and npm adds
# provenance. Each package is set up on npmjs.com (Settings → Trusted publishing: skeinui/skein, release.yml,
# environment npm).
name: Release
# Not the commit message (CI shows it for the same commit), so the two runs of a push read apart in the Actions list;
# a release commit titled "Skein UI 0.0.6" (the version pull request merged with that title) gives "Release Skein UI 0.0.6"
run-name: >-
  ${{ startsWith(github.event.head_commit.message, 'Skein UI ')
    && format('Release {0}', github.event.head_commit.message)
    || format('Release ({0})', github.ref_name) }}

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'skeinui/skein'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changesets: ${{ steps.changesets.outputs.has-changesets }}
      unpublished: ${{ steps.npm.outputs.unpublished }}
      version: ${{ steps.npm.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: open or update the version pull request
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          pr-title: Version packages
          commit-message: Version packages
      - name: versions npm doesn't have yet
        id: npm
        run: |
          unpublished=""
          for file in packages/*/package.json; do
            read -r name version private < <(node -p "const p = require('./$file'); [p.name, p.version, Boolean(p.private)].join(' ')")
            [ "$private" = "true" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")
            if [ "$code" = "404" ]; then unpublished="$unpublished $name@$version"; fi
          done
          unpublished="${unpublished# }"
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"
          # The packages are one fixed group: one version
          echo "version=$(node -p "require('./packages/ui/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "Not on npm yet: ${unpublished:-none}"

  # Before anything is published, the tests on the three platforms (as ci.yml: a Windows-only bug fails here), and
  # check and build on Linux. The approval is asked for once they all pass.
  test:
    needs: version
    if: needs.version.outputs.changesets == 'false' && needs.version.outputs.unpublished != ''
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check and build
        if: runner.os == 'Linux'
        run: pnpm exec vp check && pnpm exec vp run -r build
      - run: pnpm exec vp run -r test

  publish:
    name: publish v${{ needs.version.outputs.version }}
    needs: [version, test]
    if: needs.version.outputs.changesets == 'false' && needs.version.outputs.unpublished != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The release's tag is annotated (`git tag -a`), which needs an identity: the runner has none
      - name: git identity for the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: publish ${{ needs.version.outputs.unpublished }}
        run: pnpm release
      # One tag and one GitHub Release per version (the packages are one fixed group), notes from the CHANGELOGs.
      # Both are skipped when they exist already, so a re-run after a failure finishes the job.
      - name: tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is on GitHub already"
          else
            git tag -a "v$version" -m "Skein UI $version"
            git push origin "v$version"
          fi
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || { echo "::error::tag v$version is missing"; exit 1; }
          if ! gh release view "v$version" > /dev/null 2>&1; then
            node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "v$version" --verify-tag --title "Skein UI $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
