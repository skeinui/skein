<!doctype html>
<html lang="en" data-skein-theme="heroui" data-skein-mode="light">
  <head>
    <meta charset="UTF-8" />
    <!-- A closed announcement (site/chrome.tsx) stays hidden from the first paint -->
    <script>
      try {
        if (localStorage.getItem("skein-doc:announcement:open-source") !== null)
          document.documentElement.dataset.announcementClosed = "";
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defaults: each page sets its own (site/head.ts), and scripts/prerender.ts bakes them into its HTML -->
    <title>Skein UI · One component API. Every design language.</title>
    <meta
      name="description"
      content="100+ React components on Base UI, with swappable theme styles: HeroUI, Ant Design, shadcn or your own."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
